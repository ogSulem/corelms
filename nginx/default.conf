 map $http_upgrade $connection_upgrade {
   default upgrade;
   ''      close;
 }

# Реальный адрес клиента и схема запроса за двойным прокси (Caddy → nginx → app).
# Если Caddy уже положил X-Forwarded-For / X-Real-IP / X-Forwarded-Proto, их и
# передаём дальше: $remote_addr в этом случае — адрес контейнера Caddy, и все
# клиенты «схлопывались» в один IP (общий лимит входа 60/мин на всех сразу).
map $http_x_forwarded_for $corelms_client_ip {
  default $http_x_forwarded_for;
  ""      $remote_addr;
}
map $http_x_real_ip $corelms_real_ip {
  default $http_x_real_ip;
  ""      $remote_addr;
}
map $http_x_forwarded_proto $corelms_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Do not let a global DENY override the authenticated native PDF viewer.
map $uri $corelms_frame_policy {
  default DENY;
  ~^/api/backend/assets/[^/]+/stream$ SAMEORIGIN;
}

server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 ipv6=off valid=10s;

  client_max_body_size 26g;

  # Загрузка больших файлов идёт напрямую в backend, минуя Next.js.
  # Next держит собственный лимит времени на приём запроса (~5 минут) и обрывает
  # длинную загрузку видео: клиент получает 502 без тела ответа.
  location ^~ /api/upload/ {
    set $backend_upstream http://backend:8000;
    # При proxy_pass с переменной nginx не отрезает префикс location, и запрос
    # уходил в «/» → 405. Явный rewrite делает /api/upload/<path> → /<path>.
    rewrite ^/api/upload/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $corelms_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $corelms_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "for=$corelms_client_ip;proto=$corelms_proto;host=$host";
    proxy_set_header Connection "";

    client_max_body_size 26g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
  }

  location / {
    set $frontend_upstream http://frontend:3000;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;

    add_header X-Content-Type-Options nosniff always;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options $corelms_frame_policy always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $corelms_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $corelms_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "for=$corelms_client_ip;proto=$corelms_proto;host=$host";

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    proxy_request_buffering off;
    proxy_buffering off;

    proxy_cache off;
  }
}
