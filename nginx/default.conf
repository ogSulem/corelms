 map $http_upgrade $connection_upgrade {
   default upgrade;
   ''      close;
 }

# Do not let a global DENY override the authenticated native PDF viewer.
map $uri $corelms_frame_policy {
  default DENY;
  ~^/api/backend/assets/[^/]+/stream$ SAMEORIGIN;
}

server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 ipv6=off valid=10s;

  client_max_body_size 26g;

  # Загрузка больших файлов идёт напрямую в backend, минуя Next.js.
  # Next держит собственный лимит времени на приём запроса (~5 минут) и обрывает
  # длинную загрузку видео: клиент получает 502 без тела ответа.
  location ^~ /api/upload/ {
    set $backend_upstream http://backend:8000;
    # При proxy_pass с переменной nginx не отрезает префикс location, и запрос
    # уходил в «/» → 405. Явный rewrite делает /api/upload/<path> → /<path>.
    rewrite ^/api/upload/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "for=$remote_addr;proto=$scheme;host=$host";
    proxy_set_header Connection "";

    client_max_body_size 26g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
  }

  location / {
    set $frontend_upstream http://frontend:3000;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;

    add_header X-Content-Type-Options nosniff always;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options $corelms_frame_policy always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "for=$remote_addr;proto=$scheme;host=$host";

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    proxy_request_buffering off;
    proxy_buffering off;

    proxy_cache off;
  }
}
