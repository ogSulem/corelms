services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    cpus: 0.25

  caddy:
    image: caddy:2
    profiles: ["tls"]
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    env_file:
      - ./.env
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-}
      - CADDY_EMAIL=${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 192m
    cpus: 0.25

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdlp}
      POSTGRES_USER: ${POSTGRES_USER:-sdlp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdlp}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1024m
    cpus: 1.0

  # Один воркер на все «не медиа» очереди: импорт модулей, черновики тестов,
  # уборка и служебные задачи. Два процесса — чтобы долгий импорт ZIP не
  # задерживал черновик теста. Медиа вынесены отдельно: им нужен LibreOffice
  # и много памяти, иначе одно видео вытеснит остальные задачи.
  worker:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - AUTO_MIGRATE_ON_START=false
      - RQ_WORKER_QUEUES=${RQ_WORKER_QUEUES:-corelms_import,corelms_regen,corelms_cleanup,corelms}
      - RQ_WORKER_PROCESSES=${RQ_WORKER_PROCESSES:-2}
    entrypoint: ["python", "-m", "app.worker"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${WORKER_MEMORY_LIMIT:-768m}
    cpus: ${WORKER_CPUS:-1.5}
    pids_limit: 128

  worker_media:
    build:
      context: ./backend
      target: media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - AUTO_MIGRATE_ON_START=false
      - RQ_WORKER_QUEUES=${RQ_WORKER_MEDIA_QUEUES:-corelms_media}
      - RQ_WORKER_PROCESSES=1
      - MEDIA_ENCODER_THREADS=${MEDIA_ENCODER_THREADS:-2}
    entrypoint: ["python", "-m", "app.worker"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: ${MEDIA_WORKER_MEMORY_LIMIT:-1536m}
    cpus: ${MEDIA_WORKER_CPUS:-1.5}
    pids_limit: 128

  redis:
    image: redis:7
    restart: unless-stopped
    # This instance holds sessions and RQ jobs, not only disposable caches.
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Leave headroom for client buffers and AOF rewrite copy-on-write.
    mem_limit: ${REDIS_MEMORY_LIMIT:-640m}
    cpus: 0.5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - backend_data:/data
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - AUTO_MIGRATE_ON_START=${AUTO_MIGRATE_ON_START:-false}
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Версия кода: её показывает /health/version и диагностика на форме входа.
      - APP_VERSION=${APP_VERSION:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 1.0

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://backend:8000}
        NEXT_PUBLIC_QUICKSTART_ASSET_ID: ${NEXT_PUBLIC_QUICKSTART_ASSET_ID:-}
        NEXT_PUBLIC_QUICKSTART_VIDEO_URL: ${NEXT_PUBLIC_QUICKSTART_VIDEO_URL:-}
        NEXT_PUBLIC_TELEGRAM_SUPPLIERS_BASE_URL: ${NEXT_PUBLIC_TELEGRAM_SUPPLIERS_BASE_URL:-}
    environment:
      - APP_VERSION=${APP_VERSION:-}
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://backend:8000}
      - NEXT_PUBLIC_QUICKSTART_ASSET_ID=${NEXT_PUBLIC_QUICKSTART_ASSET_ID:-}
      - NEXT_PUBLIC_QUICKSTART_VIDEO_URL=${NEXT_PUBLIC_QUICKSTART_VIDEO_URL:-}
      - NEXT_PUBLIC_TELEGRAM_SUPPLIERS_BASE_URL=${NEXT_PUBLIC_TELEGRAM_SUPPLIERS_BASE_URL:-}
      - CORE_INTERNAL_API_BASE_URL=${CORE_INTERNAL_API_BASE_URL:-http://backend:8000}
      - JWT_ACCESS_TOKEN_MINUTES=${JWT_ACCESS_TOKEN_MINUTES:-60}
      # Пусто = авто: Secure только на HTTPS. Принудительный false превращал
      # https-вход в куку без Secure, а true ломал вход по http (кука терялась).
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000', { method: 'GET' }).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 0.75

  backend_expose:
    image: alpine:3.20
    profiles: ["dev"]
    depends_on:
      backend:
        condition: service_healthy
    network_mode: service:backend
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-lc", "sleep infinity"]
    restart: unless-stopped

  frontend_expose:
    image: alpine:3.20
    profiles: ["dev"]
    depends_on:
      frontend:
        condition: service_healthy
    network_mode: service:frontend
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-lc", "sleep infinity"]
    restart: unless-stopped

  postgres_expose:
    image: alpine:3.20
    profiles: ["dev"]
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: service:postgres
    ports:
      - "127.0.0.1:5432:5432"
    command: ["sh", "-lc", "sleep infinity"]
    restart: unless-stopped

  redis_expose:
    image: alpine:3.20
    profiles: ["dev"]
    depends_on:
      redis:
        condition: service_healthy
    network_mode: service:redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["sh", "-lc", "sleep infinity"]
    restart: unless-stopped

volumes:
  redis_data:
  pg_data:
  backend_data:
  caddy_data:
  caddy_config:
