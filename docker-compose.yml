services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: ["tls"]
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    env_file:
      - ./.env
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-}
      - CADDY_EMAIL=${CADDY_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdlp}
      POSTGRES_USER: ${POSTGRES_USER:-sdlp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdlp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker_import:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - AUTO_MIGRATE_ON_START=false
      - RQ_WORKER_QUEUES=${RQ_WORKER_IMPORT_QUEUES:-corelms_import}
      - RQ_WORKER_PROCESSES=${RQ_WORKER_IMPORT_PROCESSES:-1}
    entrypoint: ["python", "-m", "app.worker"]

  worker_regen:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - AUTO_MIGRATE_ON_START=false
      - RQ_WORKER_QUEUES=${RQ_WORKER_REGEN_QUEUES:-corelms_regen}
      - RQ_WORKER_PROCESSES=${RQ_WORKER_REGEN_PROCESSES:-1}
    entrypoint: ["python", "-m", "app.worker"]

  worker_default:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - AUTO_MIGRATE_ON_START=false
      - RQ_WORKER_QUEUES=${RQ_WORKER_DEFAULT_QUEUES:-corelms_cleanup,corelms}
      - RQ_WORKER_PROCESSES=${RQ_WORKER_DEFAULT_PROCESSES:-1}
    entrypoint: ["python", "-m", "app.worker"]

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_data:/data
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - AUTO_MIGRATE_ON_START=true
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME:-admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-admin12345}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://backend:8000}
      - CORE_INTERNAL_API_BASE_URL=${CORE_INTERNAL_API_BASE_URL:-http://backend:8000}
      - JWT_ACCESS_TOKEN_MINUTES=${JWT_ACCESS_TOKEN_MINUTES:-60}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000', { method: 'GET' }).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 20

  backend_expose:
    image: alpine:3.20
    profiles: ["dev"]
    depends_on:
      backend:
        condition: service_healthy
    network_mode: service:backend
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-lc", "sleep infinity"]
    restart: unless-stopped

  frontend_expose:
    image: alpine:3.20
    profiles: ["dev"]
    depends_on:
      frontend:
        condition: service_healthy
    network_mode: service:frontend
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-lc", "sleep infinity"]
    restart: unless-stopped

volumes:
  pg_data:
  backend_data:
  caddy_data:
  caddy_config:
