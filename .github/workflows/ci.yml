name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Новый пуш в ту же ветку отменяет прошлый прогон: очередь не копится, а
# результат всегда относится к последнему коммиту.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Deploy scripts are valid and images stay runnable
        run: |
          set -e
          for f in deploy/*.sh; do bash -n "$f"; echo "syntax ok: $f"; done
          grep -q 'chmod +x /app/scripts' deploy/rebuild-offline.sh
          for f in backend/scripts/*.sh; do
            if [ ! -x "$f" ]; then
              echo "$f is not executable in git; run: git update-index --chmod=+x $f"
              exit 1
            fi
          done
          echo "ok: entrypoint is executable"

      - name: docker-compose.yml parses (no duplicate keys)
        run: |
          set -e
          python3 -m pip install --quiet pyyaml || echo "pyyaml недоступен: проверю только docker compose config"
          # Тот же парсер, что и у деплоя: дубликат ключа в службе валит compose up
          # после десятиминутной сборки образов.
          python3 deploy/check-compose.py docker-compose.yml
          printf 'POSTGRES_DB=ci\nPOSTGRES_USER=ci\n' > .env
          docker compose -f docker-compose.yml config --quiet
          rm -f .env
          echo "ok: compose file is valid"

      - name: nginx keeps the real client IP, not the header the client sent
        run: |
          set -e
          python3 -m pip install --quiet crossplane
          python3 deploy/check-nginx.py nginx/default.conf

      - name: "Python: неопределённые имена и мусорные импорты"
        run: |
          set -e
          python3 -m pip install --quiet "ruff==0.17.4"
          cd backend
          # F821 — обращение к несуществующему имени (опечатка, которую тесты могут
          # не задеть), F811 — повторное определение, F401 — мусорный импорт,
          # E9 — синтаксис. Проверяем код, который едет в образ; тесты исключены:
          # в conftest.py импорты внутри фикстур намеренные.
          ruff check --select F401,F811,F821,F823,E9 app/ scripts/ alembic/

      - name: Block large tracked files (>20MB)
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          LIMIT = 20 * 1024 * 1024

          out = subprocess.check_output(["git", "ls-files", "-z"])
          files = [p.decode("utf-8") for p in out.split(b"\x00") if p]

          bad = []
          for f in files:
            try:
              st = os.stat(f)
            except FileNotFoundError:
              continue
            if st.st_size > LIMIT:
              bad.append((f, st.st_size))

          if bad:
            bad.sort(key=lambda x: x[1], reverse=True)
            print("Large tracked files detected (limit: 20MB):")
            for f, sz in bad:
              print(f"- {f}: {sz/1024/1024:.2f} MB")
            print("\nFix: remove from git history or use external storage; add to .gitignore.")
            sys.exit(1)

          print("OK: no tracked files > 20MB")
          PY

  backend:
    needs: guardrails
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: corelms_ci
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: corelms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corelms_ci -d corelms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install ruff==0.17.1

      - name: Install media smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libreoffice-writer libreoffice-impress fonts-dejavu-core fonts-liberation

      - name: Check undefined Python names
        run: ruff check app tests scripts --select F821,F823

      - name: Run tests
        env:
          APP_ENV: development
          JWT_SECRET_KEY: test-secret
          ALLOW_PUBLIC_REGISTER: "false"
        run: |
          pytest -q

      - name: PostgreSQL concurrency and migration regressions
        env:
          TEST_AUTH_REDIS_URL: redis://localhost:6379/15
          TEST_DATABASE_URL: postgresql+psycopg://corelms_ci:test-only-ci@localhost:5432/corelms_test
          TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://corelms_ci:test-only-ci@localhost:5432/corelms_migration_test
        run: |
          python - <<'PYTEST'
          import psycopg
          with psycopg.connect("postgresql://corelms_ci:test-only-ci@localhost:5432/corelms_test", autocommit=True) as db:
              db.execute("CREATE DATABASE corelms_migration_test")
          PYTEST
          pytest -q

  frontend:
    needs: guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Auth and API regressions
        run: yarn test

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          CORE_INTERNAL_API_BASE_URL: http://127.0.0.1:8000
          SDLP_INTERNAL_API_BASE_URL: http://127.0.0.1:8000
        run: yarn build
