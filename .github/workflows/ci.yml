name: CI

on:
  push:
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2

      - name: Block large tracked files (>20MB)
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          LIMIT = 20 * 1024 * 1024

          out = subprocess.check_output(["git", "ls-files", "-z"])
          files = [p.decode("utf-8") for p in out.split(b"\x00") if p]

          bad = []
          for f in files:
            try:
              st = os.stat(f)
            except FileNotFoundError:
              continue
            if st.st_size > LIMIT:
              bad.append((f, st.st_size))

          if bad:
            bad.sort(key=lambda x: x[1], reverse=True)
            print("Large tracked files detected (limit: 20MB):")
            for f, sz in bad:
              print(f"- {f}: {sz/1024/1024:.2f} MB")
            print("\nFix: remove from git history or use external storage; add to .gitignore.")
            sys.exit(1)

          print("OK: no tracked files > 20MB")
          PY

  backend:
    needs: guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          APP_ENV: development
          JWT_SECRET_KEY: test-secret
          ALLOW_PUBLIC_REGISTER: "false"
        run: |
          pytest -q

  frontend:
    needs: guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          CORE_INTERNAL_API_BASE_URL: http://127.0.0.1:8000
          SDLP_INTERNAL_API_BASE_URL: http://127.0.0.1:8000
        run: yarn build
